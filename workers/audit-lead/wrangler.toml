name = "audit-lead"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = true

# Secret (set with `npx wrangler secret put PABBLY_AUDIT_URL`, never committed):
#   PABBLY_AUDIT_URL  Pabbly Connect webhook for the "Audit Lead" workflow

# Per-IP and per-email throttles so the Worker can't be used to email-bomb someone.
[[ratelimits]]
name = "IP_LIMIT"
namespace_id = "41001"
simple = { limit = 5, period = 60 }

[[ratelimits]]
name = "EMAIL_LIMIT"
namespace_id = "41002"
simple = { limit = 2, period = 60 }
