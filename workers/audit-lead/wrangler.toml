name = "audit-lead"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = true

# Secrets (set with `npx wrangler secret put <NAME>`, never committed):
#   APPS_SCRIPT_URL    /exec URL of the "Reset Audit Mailer" Apps Script web app
#   APPS_SCRIPT_TOKEN  shared token, also stored as AUDIT_TOKEN in the script's Script Properties

# Per-IP and per-email throttles so the Worker can't be used to email-bomb someone.
[[ratelimits]]
name = "IP_LIMIT"
namespace_id = "41001"
simple = { limit = 5, period = 60 }

[[ratelimits]]
name = "EMAIL_LIMIT"
namespace_id = "41002"
simple = { limit = 2, period = 60 }
